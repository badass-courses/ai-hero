name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # Facade: RPC round trip, auth, decode failures, and the bundle contract
      # (no effect import survives in dist). App: hooks and the mounted route.
      - name: Front-desk support facade and route
        run: |
          pnpm --filter @ai-hero/front-desk-support build
          pnpm --filter @ai-hero/front-desk-support test
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts src/app/api/front-desk/

      - name: Checkout recovery patch contract
        run: pnpm --filter ai-hero exec vitest run -c vitest.config.ts src/lib/checkout-recovery-adopt.test.ts

      # The fulfill.mysql suite skips here without a server URL; the
      # evergreen-journey-mysql workflow runs it against disposable MySQL.
      - name: Checkout reconciler and checkout:recover
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts
          src/lib/checkout-reconcile/
          src/scripts/checkout-recovery

      - name: Refund entitlement event boundary and included-product contracts
        run: pnpm --filter ai-hero exec vitest run -c vitest.config.ts src/lib/included-product-entitlements.test.ts

      # Every PR, no path filter: a coupon or checkout policy change must meet
      # these unit contracts (the MySQL workflow runs only *.mysql.test.ts, so
      # #274 shipped with coupon-authority.test.ts still asserting the old rule).
      - name: Coupon and checkout policy unit suites
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts
          src/lib/subscriber-marketing/evergreen-offer-journey
          src/lib/exclusive-coupon-authorization.test.ts
          src/lib/shareable-evergreen-coupon.test.ts
          src/coursebuilder/server-computed-checkout-coupon.test.ts
          src/lib/subscriber-marketing/drovr-evergreen-coupon.test.ts
          src/trpc/api/routers/pricing.test.ts

      # Every PR, no path filter: every drovr, subscriber-marketing and
      # evergreen unit suite. Filters, not a file list: vitest matches each
      # argument as a substring of the test path, so a new drovr-*,
      # *evergreen* or subscriber-marketing suite runs with no edit here.
      # A named list let 28 of the 32 suites that #336-#340 touched merge
      # without CI, and #340 with a failing test. test-principals rides
      # along: its cleanup reads every contact-keyed table, so a new drovr
      # or subscriber table changes it. *.mysql.test.ts suites skip here
      # without a server URL (evergreen-journey-mysql runs them), and so
      # must any future server-bound suite these filters pull in: it needs
      # its own describe.skipIf on its server's env, or it fails here.
      - name: drovr, subscriber-marketing and evergreen unit suites
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts
          src/lib/subscriber-marketing/
          drovr
          evergreen
          skills-newsletter
          capture-purchase-contact-event
          capture-purchase-refund-contact-event
          subscribe-to-list
          kit-custom-fields-check
          src/scripts/held-exit-recover.test.ts
          src/lib/test-principals/

      - name: Workshop pricing actor contract
        run: pnpm --filter ai-hero exec vitest run -c vitest.config.ts "src/app/(content)/workshops/_components/workshop-pricing.mounted.test.tsx"

  pricing-e2e:
    # Real browser, real workshop CTAs and pricing actor; every API response is
    # an in-memory Playwright route fixture (no DB, coupon, session or Stripe).
    name: Workshop pricing e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter ai-hero exec playwright install --with-deps chromium

      - name: Workshop pricing e2e
        run: pnpm --filter ai-hero test:e2e:pricing
