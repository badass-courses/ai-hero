name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      # Facade package: RPC round trip, auth, decode failures, and the bundle
      # contract (no effect import survives in dist). Its own package suite;
      # the app side (hooks, mounted route) runs in the full suite below.
      - name: Front-desk support facade
        run: |
          pnpm --filter @ai-hero/front-desk-support build
          pnpm --filter @ai-hero/front-desk-support test

      # The whole app unit suite, every PR, no path filter. It replaces the
      # named subset steps (checkout recovery and reconciler, entitlements,
      # coupon and checkout policy, drovr, subscriber-marketing, evergreen,
      # workshop pricing): subsets let tests outside them merge red, four of
      # them by 2026-10-21. *.mysql.test.ts suites skip without a server URL;
      # the evergreen-journey-mysql workflow runs them against disposable
      # MySQL, so any new server-bound suite needs its own describe.skipIf.
      # Thread flags, not --maxWorkers: on vitest 1.6 --maxWorkers throws,
      # runs 0 tests and exits 0, so the step also fails when no test ran.
      - name: Full app unit suite
        run: |
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts \
            --poolOptions.threads.maxThreads=4 --poolOptions.threads.minThreads=1 \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-full.json"
          node -e 'const r=require(process.argv[1]); if (!(r.numTotalTests > 0)) { console.error("Full app unit suite ran 0 tests"); process.exit(1) } console.log("numTotalTests", r.numTotalTests, "failed", r.numFailedTests)' "$RUNNER_TEMP/vitest-full.json"

  pricing-e2e:
    # Real browser, real workshop CTAs and pricing actor; every API response is
    # an in-memory Playwright route fixture (no DB, coupon, session or Stripe).
    name: Workshop pricing e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter ai-hero exec playwright install --with-deps chromium

      - name: Workshop pricing e2e
        run: pnpm --filter ai-hero test:e2e:pricing
