name: Crash Course Certificate MySQL

on:
  pull_request:
    paths:
      - '.github/workflows/crash-course-certificate-mysql.yaml'
      - 'pnpm-lock.yaml'
      - 'apps/ai-hero/package.json'
      - 'apps/ai-hero/src/db/schema.ts'
      - 'apps/ai-hero/src/db/mysql-query-client.ts'
      - 'apps/ai-hero/src/course-sync/**'
      - 'apps/ai-hero/src/lib/quiz/**'
      - 'apps/ai-hero/src/trpc/api/routers/quiz*'
      - 'apps/ai-hero/src/components/mdx/quiz*'
      - 'apps/ai-hero/src/lib/crash-course-certificate-*'
      - 'apps/ai-hero/src/lib/subscriber-marketing/value-path-certificate-shares*'
      - 'apps/ai-hero/src/trpc/api/routers/certificate*'
      - 'apps/ai-hero/src/app/api/certificates/**'
      - 'apps/ai-hero/src/app/certificates/**'
      - 'apps/ai-hero/src/app/ask/**'
      - 'apps/ai-hero/src/app/(content)/_components/module-certificate-container*'
      - 'apps/ai-hero/src/app/(content)/workshops/**'
      - 'apps/ai-hero/src/components/certificates/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crash-course-certificate-mysql.yaml'
      - 'pnpm-lock.yaml'
      - 'apps/ai-hero/package.json'
      - 'apps/ai-hero/src/db/schema.ts'
      - 'apps/ai-hero/src/db/mysql-query-client.ts'
      - 'apps/ai-hero/src/course-sync/**'
      - 'apps/ai-hero/src/lib/quiz/**'
      - 'apps/ai-hero/src/trpc/api/routers/quiz*'
      - 'apps/ai-hero/src/components/mdx/quiz*'
      - 'apps/ai-hero/src/lib/crash-course-certificate-*'
      - 'apps/ai-hero/src/lib/subscriber-marketing/value-path-certificate-shares*'
      - 'apps/ai-hero/src/trpc/api/routers/certificate*'
      - 'apps/ai-hero/src/app/api/certificates/**'
      - 'apps/ai-hero/src/app/certificates/**'
      - 'apps/ai-hero/src/app/ask/**'
      - 'apps/ai-hero/src/app/(content)/_components/module-certificate-container*'
      - 'apps/ai-hero/src/app/(content)/workshops/**'
      - 'apps/ai-hero/src/components/certificates/**'

jobs:
  mysql-contract:
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aih_test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paih_test_password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guarded certificate evidence suite
        env:
          AIH_COURSE_CERTIFICATE_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
        run: |
          pnpm --filter @ai-hero/course-sync-schema build
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts \
            src/lib/crash-course-certificate-eligibility.test.ts \
            src/lib/crash-course-certificate-eligibility.mysql.test.ts \
            src/lib/crash-course-certificate-gate.test.ts \
            src/lib/crash-course-certificate-shares.test.ts \
            src/lib/subscriber-marketing/value-path-certificate-shares.test.ts \
            src/trpc/api/routers/certificate.test.ts \
            src/app/api/certificates/route.test.tsx \
            src/app/'(content)'/_components/module-certificate-container.test.tsx \
            src/app/certificates/'[slug]'/page.test.tsx \
            src/app/certificates/'[slug]'/og/route.test.tsx \
            src/components/certificates/module-certificate.test.ts \
            src/components/certificates/skills-workflow-certificate-og.test.tsx \
            src/app/ask/'[slug]'/page.test.tsx
