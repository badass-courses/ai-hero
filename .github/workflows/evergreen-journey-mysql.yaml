name: Evergreen Journey MySQL

on:
  pull_request:
    paths:
      - ".github/workflows/evergreen-journey-mysql.yaml"
      - "pnpm-lock.yaml"
      - "apps/ai-hero/package.json"
      - "apps/ai-hero/src/db/evergreen-offer-journey-schema.ts"
      - "apps/ai-hero/src/db/course-sequence-exhaustion-schema.ts"
      - "apps/ai-hero/src/db/schema.ts"
      - "apps/ai-hero/src/db/migrations/**"
      - "apps/ai-hero/src/db/mysql-query-client.ts"
      - "apps/ai-hero/src/lib/mysql-primary-key-retry.ts"
      - "apps/ai-hero/src/lib/team-purchase-mysql-test-guard.ts"
      - "apps/ai-hero/src/lib/subscriber-marketing/evergreen-offer-journey/**"
      - "apps/ai-hero/src/lib/subscriber-marketing/course-sequence-exhaustion*"
      - "apps/ai-hero/src/lib/subscriber-marketing/drizzle-capture-repository*"
      - "apps/ai-hero/src/lib/subscriber-marketing/value-path-drip-progression.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evergreen-journey-mysql.yaml"
      - "pnpm-lock.yaml"
      - "apps/ai-hero/package.json"
      - "apps/ai-hero/src/db/evergreen-offer-journey-schema.ts"
      - "apps/ai-hero/src/db/course-sequence-exhaustion-schema.ts"
      - "apps/ai-hero/src/db/schema.ts"
      - "apps/ai-hero/src/db/migrations/**"
      - "apps/ai-hero/src/db/mysql-query-client.ts"
      - "apps/ai-hero/src/lib/mysql-primary-key-retry.ts"
      - "apps/ai-hero/src/lib/team-purchase-mysql-test-guard.ts"
      - "apps/ai-hero/src/lib/subscriber-marketing/evergreen-offer-journey/**"
      - "apps/ai-hero/src/lib/subscriber-marketing/course-sequence-exhaustion*"
      - "apps/ai-hero/src/lib/subscriber-marketing/drizzle-capture-repository*"
      - "apps/ai-hero/src/lib/subscriber-marketing/value-path-drip-progression.ts"

jobs:
  mysql-contract:
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aih_test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paih_test_password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guarded journey and course persistence suite
        env:
          AIH_EVERGREEN_JOURNEY_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/drizzle-ledger.mysql.test.ts
          src/lib/subscriber-marketing/course-sequence-exhaustion.mysql.test.ts
