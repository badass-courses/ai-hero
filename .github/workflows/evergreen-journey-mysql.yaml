permissions:
  contents: read

jobs:
  mysql-contract:
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aih_test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paih_test_password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guarded journey and course persistence suite
        env:
          AIH_EVERGREEN_JOURNEY_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
          AIH_EVERGREEN_COUPON_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
          AIH_PURCHASE_DISPUTES_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/purchase_disputes_test
          AIH_PURCHASE_FIELDS_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/purchase_fields_test
          AIH_ENTITLEMENTS_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/entitlements_test
        # Many suites share one MySQL in parallel, so the long composition
        # tests run past vitest's 5s default and timed out on main too
        # (runs 35258220266, 35742641569).
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts --testTimeout=30000
          src/lib/subscriber-marketing/evergreen-offer-journey/drizzle-ledger.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/coupon-authority.mysql.test.ts
          src/lib/subscriber-marketing/course-sequence-exhaustion.mysql.test.ts
          src/lib/subscriber-marketing/email-course-drizzle-ledger.mysql.test.ts
          src/lib/subscriber-marketing/contact-email-integrity.mysql.test.ts
          src/lib/subscriber-marketing/contact-integrity-maintenance.mysql.test.ts
          src/lib/test-principals/test-principal.mysql.test.ts
          src/lib/subscriber-marketing/signup-confirmation-reconciler.mysql.test.ts
          src/lib/subscriber-marketing/contact-sync-stores.mysql.test.ts
          src/lib/subscriber-marketing/contact-sync-reconcile.mysql.test.ts
          src/lib/subscriber-marketing/contact-sync-backfill.mysql.test.ts
          src/lib/subscriber-marketing/owner-birth-guard.mysql.test.ts
          src/lib/subscriber-marketing/drovr-outbox-drizzle.mysql.test.ts
          src/lib/subscriber-marketing/drovr-outbox-live.mysql.test.ts
          src/lib/subscriber-marketing/exit-held-intents.mysql.test.ts
          src/lib/subscriber-marketing/purchase-exit-proof.mysql.test.ts
          src/lib/purchase-disputes.mysql.test.ts
          src/lib/purchase-fields-write.mysql.test.ts
          src/lib/entitlements-per-purchase.mysql.test.ts
          src/lib/checkout-reconcile/fulfill.mysql.test.ts
          src/lib/certificates.mysql.test.ts

      # Preserve the existing suite's starting filesystem/server state. Build
      # and run the new opt-in contract only after those unchanged tests pass.
      - name: Build course-sync schema
        run: pnpm --filter @ai-hero/course-sync-schema build

      - name: Run guarded course-sync activation suite
        env:
          AIH_COURSE_SYNC_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/course_sync_verifier_test
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts --testTimeout=30000
          src/course-sync/drizzle-persistence.mysql.test.ts

      - name: Run guarded coupon mint suite
        env:
          AIH_COUPON_MINT_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/coupon_mint_test
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -paih_test_password -e 'CREATE DATABASE IF NOT EXISTS coupon_mint_test'
          pnpm --filter ai-hero exec node scripts/test-mysql-schema.mjs "$AIH_COUPON_MINT_MYSQL_URL"
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts --testTimeout=30000 --minWorkers=1 --maxWorkers=4 --no-file-parallelism src/lib/coupon-mint.mysql.test.ts src/lib/paid-coupon-usage.mysql.test.ts src/inngest/functions/count-paid-coupon-use.test.ts src/inngest/count-paid-coupon-use-registration.test.ts

      # Capacity fixtures call the production invoice reader, whose workspace
      # pricing export resolves to dist rather than source.
      - name: Build front-desk support for capacity fixtures
        run: pnpm --filter @ai-hero/front-desk-support build

      - name: Run guarded coupon batch suite
        env:
          AIH_COUPON_BATCH_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/coupon_batch_fixture
          AIH_COUPON_CAPACITY_MYSQL_URL: mysql://root:aih_test_password@127.0.0.1:3307/coupon_capacity_fixture
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -paih_test_password -e 'CREATE DATABASE IF NOT EXISTS coupon_batch_fixture'
          pnpm --filter ai-hero exec node scripts/test-mysql-schema.mjs "$AIH_COUPON_BATCH_MYSQL_URL" --check-coupon-batch-migration
          mysql -h 127.0.0.1 -P 3307 -uroot -paih_test_password -e 'CREATE DATABASE IF NOT EXISTS coupon_capacity_fixture'
