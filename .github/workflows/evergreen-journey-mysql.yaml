jobs:
  mysql-contract:
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aih_test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paih_test_password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guarded journey and course persistence suite
        env:
          AIH_EVERGREEN_JOURNEY_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
          AIH_EVERGREEN_COUPON_MYSQL_TEST_SERVER_URL: mysql://root:aih_test_password@127.0.0.1:3307/mysql
        # Twenty-one suites share one MySQL in parallel. The long composition
        # tests (bridge-runtime, evergreen-pilot) run past vitest's 5s default
        # and timed out on main too (runs 35258220266, 35742641569).
        run: >-
          pnpm --filter ai-hero exec vitest run -c vitest.config.ts --testTimeout=30000
          src/lib/subscriber-marketing/evergreen-offer-journey/drizzle-ledger.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/current-authority-repository.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/coupon-authority.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/verified-owner-proof.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/coupon-executor.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/bounded-readers.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/message-executor.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/original-delivery-mapping.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/bridge-runtime.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/message-preparation.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/email-token-login-observation.mysql.test.ts
          src/lib/subscriber-marketing/course-sequence-exhaustion.mysql.test.ts
          src/lib/subscriber-marketing/email-course-drizzle-ledger.mysql.test.ts
          src/lib/subscriber-marketing/contact-email-integrity.mysql.test.ts
          src/lib/subscriber-marketing/contact-integrity-maintenance.mysql.test.ts
          src/lib/subscriber-marketing/evergreen-offer-journey/verified-user-observed-source.mysql.test.ts
          src/server/evergreen-pilot.mysql.test.ts
          src/lib/test-principals/test-principal.mysql.test.ts
          src/lib/subscriber-marketing/signup-confirmation-reconciler.mysql.test.ts
          src/lib/subscriber-marketing/contact-sync-stores.mysql.test.ts
          src/lib/subscriber-marketing/contact-sync-reconcile.mysql.test.ts
