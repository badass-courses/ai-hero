name: CTA report

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Audit published post CTAs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scheduled CTA report
        run: >-
          pnpm --filter ai-hero cta-report
          --mode scheduled
          --scope all
          --output "${RUNNER_TEMP}/cta-report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-report-${{ github.run_id }}
          path: ${{ runner.temp }}/cta-report.json
          if-no-files-found: warn
          retention-days: 30
