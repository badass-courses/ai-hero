name: CTA report

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Audit published post CTAs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scheduled CTA report
        # Scoped to this step: install scripts and other steps never see the DB credential.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          pnpm --filter ai-hero cta-report
          --mode scheduled
          --scope all
          --output "${RUNNER_TEMP}/cta-report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cta-report-${{ github.run_id }}
          path: ${{ runner.temp }}/cta-report.json
          if-no-files-found: warn
          retention-days: 30
