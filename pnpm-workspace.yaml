packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: false
  msw: true
  nodemailer: true
  protobufjs: true
  sharp: true
  typesense-instantsearch-adapter: true
  unrs-resolver: true
  workerd: true

overrides:
  '@coursebuilder/core': '2.0.3'
  # Core 2.0.3 was published with workspace protocols in its npm manifest.
  # Resolve those two package-local dependencies to the versions in its pack artifact.
  '@coursebuilder/core@2.0.3>@coursebuilder/email-templates': '1.0.8'
  '@coursebuilder/core@2.0.3>@coursebuilder/nodash': '0.0.3'
  '@internationalized/date': '3.12.2'
  '@types/react': '19.2.7'
  '@types/react-dom': '19.2.3'
  '@codemirror/state': '6.7.0'
  # Keep the launch app on its existing CSS compiler while the status tracer adds Vite 8.
  lightningcss: '1.32.0'

packageExtensions:
  '@coursebuilder/ui@*':
    dependencies:
      '@internationalized/date': '3.12.2'
  # @uiw/react-markdown-editor imports @codemirror/state and @codemirror/view
  # without declaring them (relies on hoisting), which breaks on a clean install
  # once @codemirror/state is pinned via overrides. Declare them so pnpm always
  # links them into the package.
  '@uiw/react-markdown-editor@*':
    dependencies:
      '@codemirror/state': '^6.0.0'
      '@codemirror/view': '^6.0.0'

patchedDependencies:
  '@coursebuilder/core@2.0.3': patches/@coursebuilder__core@2.0.3.patch
